<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Acha Região</title>
<meta name="theme-color" content="#F5C518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/logo-icon.png">
<link rel="apple-touch-icon" href="assets/logo-icon.png">
<link rel="manifest" href="data:application/json,{name:'Acha Região',short_name:'Acha',start_url:'.',display:'standalone',background_color:'%2309090B',theme_color:'%23F5C518',icons:[{src:'assets/logo-icon.png',sizes:'192x192'},{src:'assets/logo-icon.png',sizes:'512x512'}]}">
<style>
:root{--y:#F5C518;--yd:#D4A800;--yg:rgba(245,197,24,.10);--bg:#09090B;--bg2:#0F0F12;--s:#141417;--c:#1A1A1E;--b:#27272C;--t:#F5F5F7;--t2:#A1A1AA;--t3:#6B6B70;--r:14px;--g:#25D366;--safe:env(safe-area-inset-bottom,8px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:Inter,-apple-system,sans-serif;overflow:hidden;height:100dvh;-webkit-font-smoothing:antialiased}
#root{max-width:500px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;overflow-y:auto;overflow-x:hidden}
.page.right{transform:translateX(100%);opacity:0;pointer-events:none}
.page.left{transform:translateX(-40px);opacity:0;pointer-events:none}
.page.hide{opacity:0;pointer-events:none;transform:none}

/* ═══ SPLASH ═══ */
#splash{justify-content:center;align-items:center;z-index:99;background:var(--bg)}
.splash-logo{animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
.splash-logo img{height:72px}
.splash-sub{font-size:11px;color:var(--t3);letter-spacing:4px;text-transform:uppercase;text-align:center;margin-top:6px}
.splash-ring{width:44px;height:44px;border:3px solid var(--y);border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-top:28px}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ AUTH ═══ */
.auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px}
.auth-wrap img{height:44px;align-self:center;margin-bottom:28px}
.auth-wrap h1{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px;letter-spacing:-0.5px}
.auth-wrap h1 em{font-style:normal;color:var(--y)}
.auth-wrap .sub{font-size:13px;color:var(--t3);text-align:center;margin-bottom:28px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fld input{width:100%;padding:12px 14px;background:var(--c);border:1px solid var(--b);border-radius:var(--r);color:var(--t);font-size:14px;outline:none;font-family:inherit;transition:border .2s}
.fld input:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--yg)}
.btn{width:100%;padding:14px;background:var(--y);color:#1A1800;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s;letter-spacing:-0.2px}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-o{background:transparent;color:var(--y);border:2px solid var(--y);margin-top:12px}
.switch{text-align:center;margin-top:18px;font-size:12px;color:var(--t2)}
.switch b{color:var(--y);cursor:pointer}
.err{color:#F87171;font-size:12px;text-align:center;min-height:18px;margin-top:6px}

/* ═══ TUTORIAL ═══ */
#tutorial{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:28px}
.tu-card{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:32px 24px;max-width:340px;text-align:center;animation:tuPop .4s cubic-bezier(.34,1.56,.64,1)}
.tu-icon{font-size:52px;margin-bottom:14px}
.tu-card h2{font-size:19px;font-weight:800;margin-bottom:8px;letter-spacing:-0.3px}
.tu-card h2 em{font-style:normal;color:var(--y)}
.tu-card p{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:22px}
.tu-dots{display:flex;gap:5px;justify-content:center;margin-bottom:20px}
.tu-dot{width:8px;height:8px;border-radius:4px;background:var(--b);transition:.2s}
.tu-dot.on{width:22px;background:var(--y)}
@keyframes tuPop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ═══ FEED ═══ */
.yellow-header{background:linear-gradient(135deg,var(--y),#FFD42A,var(--y));padding:14px 16px 16px;position:relative;overflow:hidden}
.yellow-header::after{content:'';position:absolute;top:-12px;right:-12px;width:90px;height:90px;background:radial-gradient(circle,rgba(0,0,0,.04) 1px,transparent 1px);background-size:7px 7px;opacity:.3}
.yh-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:12px}
.yh-top img{height:24px}
.search-bar{display:flex;align-items:center;background:#1A1A1E;border:2px solid rgba(245,197,24,.3);border-radius:12px;height:44px;padding:0 14px;gap:6px;position:relative;z-index:1;transition:border .2s,box-shadow .2s}
.search-bar:focus-within{border-color:var(--y);box-shadow:0 0 0 4px var(--yg)}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--t);font-size:13px}
.search-bar input::placeholder{color:var(--t3)}
.cat-scroll{padding:10px 14px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{height:30px;padding:0 13px;border-radius:15px;font-size:11px;font-weight:700;border:1px solid var(--b);color:var(--t2);background:var(--s);cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;transition:.15s}
.cat-chip.on{background:var(--y);color:#1A1800;border-color:var(--y);box-shadow:0 2px 10px rgba(245,197,24,.25)}
.sec-bar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.sec-bar h3{font-size:15px;font-weight:700}
.sec-bar em{font-style:normal;font-size:12px;font-weight:700;color:var(--y)}
.product-grid{padding:0 12px 90px;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;overflow-y:auto}
.card{background:var(--c);border-radius:var(--r);overflow:hidden;border:1px solid var(--b);cursor:pointer;transition:transform .12s;animation:fadeUp .35s ease both}
.card:active{transform:scale(.97)}
.card:nth-child(1){animation-delay:0s}.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}.card:nth-child(4){animation-delay:.12s}.card:nth-child(5){animation-delay:.16s}.card:nth-child(6){animation-delay:.2s}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card .img-wrap{position:relative}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card .c-badge{position:absolute;top:7px;left:7px;background:var(--y);padding:2px 7px;border-radius:5px;font-size:8px;font-weight:800;color:#1A1800;text-transform:uppercase;letter-spacing:.3px}
.card .c-grad{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(transparent,rgba(26,26,30,.85))}
.card .c-body{padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.card .c-title{font-size:11px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c-price{font-size:16px;font-weight:800;color:var(--y);letter-spacing:-0.3px}
.card .c-loc{font-size:9px;color:var(--t3);display:flex;align-items:center;gap:4px}
.card .c-dot{width:4px;height:4px;border-radius:50%;background:rgba(245,197,24,.35);flex-shrink:0}

/* ═══ DETAIL ═══ */
.detail-back{position:absolute;top:14px;left:14px;z-index:10;background:rgba(0,0,0,.55);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;border:none;backdrop-filter:blur(8px)}
.detail-scroll{flex:1;overflow-y:auto;padding-bottom:100px}
.detail-scroll .d-img{width:100%;aspect-ratio:4/3;object-fit:cover}
.detail-scroll .d-info{padding:18px 16px}
.detail-scroll .d-price{font-size:28px;font-weight:900;color:var(--y);margin-bottom:4px;letter-spacing:-0.5px}
.detail-scroll .d-title{font-size:17px;font-weight:700;margin-bottom:6px}
.detail-scroll .d-desc{font-size:13px;color:var(--t2);line-height:1.55;margin-bottom:14px}
.detail-scroll .d-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.detail-scroll .d-tags span{background:var(--s);padding:5px 10px;border-radius:7px;font-size:11px;color:var(--t2);font-weight:600}
.d-seller{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;margin:0 16px 18px}
.d-seller .ds-av{width:44px;height:44px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#1A1800;flex-shrink:0}
.d-seller .ds-name{font-size:13px;font-weight:700}
.d-seller .ds-sub{font-size:11px;color:var(--t3)}
.d-related{padding:0 16px 20px}
.d-related h4{font-size:14px;font-weight:700;margin-bottom:10px}
.d-related .rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-wa{padding:16px}
.d-wa a{text-decoration:none}
.d-wa button{width:100%;padding:15px;background:var(--g);color:#fff;border:none;border-radius:var(--r);font-weight:700;font-size:14px;cursor:pointer}

/* ═══ CREATE ═══ */
.create-scroll{flex:1;overflow-y:auto;padding:18px 16px}
.create-scroll h2{font-size:19px;font-weight:800;margin-bottom:20px;letter-spacing:-0.3px}
.create-scroll h2 em{font-style:normal;color:var(--y)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.photo-slot{width:82px;height:82px;border:2px dashed var(--b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--t3);cursor:pointer;overflow:hidden;position:relative;transition:border .2s}
.photo-slot:hover{border-color:var(--y)}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.cf label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}
.cf label .req{color:#F87171}
.cf input,.cf textarea,.cf select{width:100%;padding:11px 14px;background:var(--c);border:1px solid var(--b);border-radius:var(--r);color:var(--t);font-size:13px;outline:none;font-family:inherit;transition:border .2s}
.cf input:focus,.cf textarea:focus,.cf select:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--yg)}
.cf textarea{height:90px;resize:none}

/* ═══ PROFILE ═══ */
.prof-cover{height:130px;background:linear-gradient(135deg,var(--y),#FFD42A);position:relative}
.prof-av{width:76px;height:76px;border-radius:50%;background:var(--c);border:3px solid var(--bg);margin-top:-38px;margin-left:20px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;z-index:2}
.prof-info{padding:12px 20px;margin-bottom:16px}
.prof-info h2{font-size:19px;font-weight:800;margin-bottom:2px}
.prof-info .ploc{font-size:12px;color:var(--t3);margin-bottom:8px}
.prof-stars{display:flex;gap:1px}
.prof-stars span{font-size:16px}
.prof-tab-row{display:flex;border-bottom:1px solid var(--b);margin:0 18px}
.prof-tab{flex:1;text-align:center;padding:12px 0;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:.15s}
.prof-tab.on{color:var(--y);border-bottom-color:var(--y)}
.prof-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--t3)}
.prof-empty .pe{font-size:44px;margin-bottom:10px}

/* ═══ TAB BAR ═══ */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:58px;background:#0C0C10;border-top:2px solid var(--y);display:flex;justify-content:space-around;align-items:center;padding-bottom:var(--safe);z-index:50;backdrop-filter:blur(12px)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:700;color:var(--t3);cursor:pointer;border:none;background:none;padding:4px 0;transition:color .15s}
.tab-item.on{color:var(--y)}
.tab-item .ti{font-size:18px}

/* ═══ INSTALL + TOAST ═══ */
#installBar{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:60;background:var(--y);color:#1A1800;padding:12px 22px;border-radius:14px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 4px 20px rgba(245,197,24,.35);white-space:nowrap}
#installBar.show{display:block}
.toast-ctr{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:400}
.toast{background:var(--s);border:1px solid var(--b);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;color:var(--t);box-shadow:0 8px 28px rgba(0,0,0,.5);animation:toastIn .3s ease;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="root">

  <!-- ═══ SPLASH ═══ -->
  <div class="page" id="splash">
    <div class="splash-logo">
      <img src="assets/logo-text.png" alt="Acha Região" onerror="this.outerHTML='<div style=font-size:26px;font-weight:900;color:var(--y);text-align:center>acha<span style=font-size:9px;color:var(--t3)>REGIÃO</span></div>'">
      <div class="splash-sub">Alto Vale do Itajaí</div>
    </div>
    <div class="splash-ring"></div>
  </div>

  <!-- ═══ AUTH ═══ -->
  <div class="page right" id="auth">
    <div class="auth-wrap">
      <img src="assets/logo-text.png" alt="Acha Região" onerror="this.style.display='none'">
      <h1>Bem-vindo ao <em>Acha</em></h1>
      <p class="sub">O marketplace da nossa região</p>
      <div id="regForm">
        <div class="fld"><label>Nome completo</label><input type="text" id="rName" placeholder="Seu nome"></div>
        <div class="fld"><label>Email</label><input type="email" id="rEmail" placeholder="seu@email.com"></div>
        <div class="fld"><label>Senha</label><input type="password" id="rPass" placeholder="Mínimo 6 caracteres"></div>
        <div class="err" id="rErr"></div>
        <button class="btn" onclick="doRegister()">Criar conta</button>
        <p class="switch">Já tem conta? <b onclick="toggleAuth()">Entrar</b></p>
      </div>
      <div id="loginForm" style="display:none">
        <div class="fld"><label>Email</label><input type="email" id="lEmail" placeholder="seu@email.com"></div>
        <div class="fld"><label>Senha</label><input type="password" id="lPass" placeholder="Sua senha"></div>
        <div class="err" id="lErr"></div>
        <button class="btn" onclick="doLogin()">Entrar</button>
        <p class="switch">Não tem conta? <b onclick="toggleAuth()">Criar conta</b></p>
      </div>
    </div>
  </div>

  <!-- ═══ FEED ═══ -->
  <div class="page right" id="feed">
    <div class="yellow-header">
      <div class="yh-top"><img src="assets/logo-text.png" alt="Acha Região" onerror="this.outerHTML='<b style=font-size:18px;color:#1A1800>acha</b>'"></div>
      <div class="search-bar"><span style="font-size:15px">🔍</span><input type="text" id="fSearch" placeholder="Buscar produtos..." oninput="renderFeed()"></div>
    </div>
    <div class="cat-scroll" id="catBar"></div>
    <div class="sec-bar"><h3 id="fTitle">Todos os produtos</h3><em id="fCount"></em></div>
    <div class="product-grid" id="fGrid"></div>
    <div class="tab-bar">
      <button class="tab-item on" onclick="goTab('feed',this)"><span class="ti">🏷️</span>Explorar</button>
      <button class="tab-item" onclick="goTab('create',this)"><span class="ti">📦</span>Anunciar</button>
      <button class="tab-item" onclick="goTab('profile',this)"><span class="ti">👤</span>Perfil</button>
    </div>
  </div>

  <!-- ═══ CREATE ═══ -->
  <div class="page right" id="create">
    <div class="yellow-header"><div class="yh-top"><b style="font-size:18px;color:#1A1800">📦 Novo anúncio</b></div></div>
    <div class="create-scroll">
      <div class="photo-row"><div class="photo-slot" onclick="document.getElementById('pInput').click()">+</div></div>
      <input type="file" id="pInput" accept="image/*" multiple hidden onchange="addPhotos(event)">
      <div class="cf">
        <label>Título <span class="req">*</span></label><input type="text" id="cTitle" placeholder="Ex: Sofá 3 lugares retrátil" maxlength="100">
        <label>Descrição <span class="req">*</span></label><textarea id="cDesc" placeholder="Descreva o produto em detalhes: estado, tempo de uso, motivo da venda..."></textarea>
        <label>Preço (R$) <span class="req">*</span></label><input type="number" id="cPrice" placeholder="850" min="0">
        <label>Categoria</label><select id="cCat"><option>Móveis</option><option>Eletrônicos</option><option>Veículos</option><option>Roupas</option><option>Esportes</option><option>Casa</option><option>Ferramentas</option></select>
        <label>Localização <span class="req">*</span></label><select id="cCity"><option>Presidente Getúlio</option><option>Rio do Sul</option><option>Ibirama</option><option>Laurentino</option><option>Lontras</option><option>Aurora</option></select>
        <button class="btn" style="margin-top:22px" onclick="publish()">📢 Publicar anúncio</button>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-item" onclick="goTab('feed',this)"><span class="ti">🏷️</span>Explorar</button>
      <button class="tab-item on" onclick="goTab('create',this)"><span class="ti">📦</span>Anunciar</button>
      <button class="tab-item" onclick="goTab('profile',this)"><span class="ti">👤</span>Perfil</button>
    </div>
  </div>

  <!-- ═══ PROFILE ═══ -->
  <div class="page right" id="profile">
    <div class="prof-cover"></div>
    <div class="prof-av">👤</div>
    <div class="prof-info">
      <h2 id="profName"></h2>
      <p class="ploc" id="profLoc"></p>
      <div class="prof-stars"><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span><span>⭐</span></div>
    </div>
    <div class="prof-tab-row">
      <div class="prof-tab on" onclick="profSwitch('posts',this)">Meus anúncios</div>
      <div class="prof-tab" onclick="profSwitch('info',this)">Sobre</div>
    </div>
    <div class="prof-grid" id="profGrid"></div>
    <div class="tab-bar">
      <button class="tab-item" onclick="goTab('feed',this)"><span class="ti">🏷️</span>Explorar</button>
      <button class="tab-item" onclick="goTab('create',this)"><span class="ti">📦</span>Anunciar</button>
      <button class="tab-item on" onclick="goTab('profile',this)"><span class="ti">👤</span>Perfil</button>
    </div>
  </div>

  <!-- ═══ DETAIL ═══ -->
  <div class="page right" id="detail">
    <button class="detail-back" onclick="goTab('feed')">←</button>
    <div class="detail-scroll" id="dContent"></div>
    <div class="tab-bar">
      <button class="tab-item on" onclick="goTab('feed',this)"><span class="ti">🏷️</span>Explorar</button>
      <button class="tab-item" onclick="goTab('create',this)"><span class="ti">📦</span>Anunciar</button>
      <button class="tab-item" onclick="goTab('profile',this)"><span class="ti">👤</span>Perfil</button>
    </div>
  </div>

</div>

<div id="tutorial" style="display:none"><div class="tu-card" id="tuInner"></div></div>
<div id="installBar" onclick="install()">📲 Toque para instalar o app</div>
<div class="toast-ctr" id="toasts"></div>

<script>
// ═══════ STATE ═══════
let user=null, products=[], photos=[], currentPage='splash', activeCat='Todos';

// ═══════ INIT ═══════
window.addEventListener('beforeinstallprompt',e=>{window._pwa=e;document.getElementById('installBar').classList.add('show')});
if(window.matchMedia('(display-mode: standalone)').matches)document.getElementById('installBar').classList.remove('show');

(function init(){
  const u=localStorage.getItem('acha_user');
  if(u)user=JSON.parse(u);
  loadProducts();
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
    if(user)goTab('feed'); else goTab('auth');
  },2200);
})();

function loadProducts(){
  const local=JSON.parse(localStorage.getItem('acha_products')||'[]');
  const def=[
    {id:'d1',title:'iPhone 13 Pro 128GB Grafite',desc:'Como novo, com nota fiscal e caixa. 1 ano de uso, sem riscos.',price:3200,city:'Rio do Sul',category:'Eletrônicos',images:['https://images.unsplash.com/photo-1632661675695-15c8e3e8e7b4?w=600&h=450&fit=crop'],seller:'Marcos Silva',stars:4.8},
    {id:'d2',title:'Sofá 3 Lugares Retrátil Bege',desc:'Confortável, pouco uso. Retrátil nos 3 lugares. Entrego na região.',price:850,city:'Presidente Getúlio',category:'Móveis',images:['https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&h=450&fit=crop'],seller:'Ana Oliveira',stars:4.5},
    {id:'d3',title:'Honda CG 160 Titan 2023',desc:'8.000km, todas revisões na concessionária. Pneus novos, IPVA pago.',price:14500,city:'Ibirama',category:'Veículos',images:['https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=600&h=450&fit=crop'],seller:'João Santos',stars:4.9},
    {id:'d4',title:'Geladeira Brastemp 375L',desc:'Frost Free, 2 anos de uso. Perfeito estado, motivo: mudança.',price:1800,city:'Rio do Sul',category:'Eletrônicos',images:['https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=600&h=450&fit=crop'],seller:'Carla Mendes',stars:4.6},
    {id:'d5',title:'Mesa de Jantar 6 Lugares',desc:'Madeira maciça + 6 cadeiras estofadas. 3 anos de uso.',price:650,city:'Presidente Getúlio',category:'Móveis',images:['https://images.unsplash.com/photo-1556909114-f6e7ad7d6ab6?w=600&h=450&fit=crop'],seller:'Pedro Costa',stars:4.3},
    {id:'d6',title:'Kit Halteres 20kg + Barra',desc:'Completo: halteres montáveis, barra de 1,2m e 40kg de anilhas.',price:280,city:'Laurentino',category:'Esportes',images:['https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=600&h=450&fit=crop'],seller:'Lucas Alves',stars:4.7},
  ];
  products=[...local,...def];
  try{
    fetch('https://acha-regiao-api.onrender.com/api/products').then(r=>r.json()).then(d=>{
      products=[...local,...d.map(x=>({...x,seller:x.sellerName||'Vendedor',stars:x.sellerStars||4.5,images:x.images||[x.imageUrl]}))];
      renderFeed();
    }).catch(()=>{});
  }catch(e){}
  renderCategories();
}

// ═══════ NAVIGATION ═══════
function goTab(page,el){
  if(page==='feed'&&!user){goTab('auth');return}
  if(page==='profile'&&!user){goTab('auth');return}
  document.querySelectorAll('.page').forEach(p=>{if(p.id!==page)p.classList.add('right');else p.classList.remove('right','hide')});
  document.querySelectorAll('.tab-item').forEach(t=>t.classList.remove('on'));
  if(el)el.classList.add('on');
  currentPage=page;
  if(page==='feed')renderFeed();
  if(page==='profile')renderProfile();
}

// ═══════ AUTH ═══════
function toggleAuth(){
  document.getElementById('regForm').style.display=document.getElementById('regForm').style.display==='none'?'block':'none';
  document.getElementById('loginForm').style.display=document.getElementById('loginForm').style.display==='none'?'block':'none';
  document.getElementById('rErr').textContent='';document.getElementById('lErr').textContent='';
}

function doRegister(){
  const n=document.getElementById('rName').value.trim(),e=document.getElementById('rEmail').value.trim(),p=document.getElementById('rPass').value;
  if(!n||!e||!p){document.getElementById('rErr').textContent='Preencha todos os campos';return}
  if(p.length<6){document.getElementById('rErr').textContent='Senha: mínimo 6 caracteres';return}
  if(!e.includes('@')){document.getElementById('rErr').textContent='Email inválido';return}
  const users=JSON.parse(localStorage.getItem('acha_users')||'[]');
  if(users.find(u=>u.email===e)){document.getElementById('rErr').textContent='Email já cadastrado';return}
  user={id:'u_'+Date.now(),name:n,email:e,password:p,city:'Presidente Getúlio',stars:0,createdAt:new Date().toISOString()};
  users.push(user);localStorage.setItem('acha_users',JSON.stringify(users));localStorage.setItem('acha_user',JSON.stringify(user));
  showTutorial();
}

function doLogin(){
  const e=document.getElementById('lEmail').value.trim(),p=document.getElementById('lPass').value;
  const users=JSON.parse(localStorage.getItem('acha_users')||'[]');
  const f=users.find(u=>u.email===e&&u.password===p);
  if(!f){document.getElementById('lErr').textContent='Email ou senha incorretos';return}
  user=f;localStorage.setItem('acha_user',JSON.stringify(user));
  goTab('feed');toast('👋 Bem-vindo de volta, '+user.name.split(' ')[0]+'!');
}

// ═══════ TUTORIAL ═══════
const tuSteps=[
  {icon:'👤',title:'Seu <em>Perfil</em>',text:'Aqui é sua identidade no Acha Região. Coloque uma foto para as pessoas te reconhecerem. Suas estrelas representam sua reputação.',btn:'Próximo'},
  {icon:'⭐',title:'Suas <em>Estrelas</em>',text:'Ao vender produtos ou realizar serviços, os compradores vão te avaliar. Quanto mais ⭐, mais confiança e mais vendas!',btn:'Entendi'},
  {icon:'📦',title:'Seus <em>Anúncios</em>',text:'Liste tudo o que quer vender: fotos, preço, descrição e localização. Quanto mais completo e detalhado, mais rápido vende!',btn:'Começar!'},
];
let tuIdx=0;
function showTutorial(){
  tuIdx=0;document.getElementById('tutorial').style.display='flex';renderTuStep();
}
function renderTuStep(){
  const s=tuSteps[tuIdx];
  document.getElementById('tuInner').innerHTML=`
    <div class="tu-icon">${s.icon}</div><h2>${s.title}</h2><p>${s.text}</p>
    <div class="tu-dots">${tuSteps.map((_,i)=>`<div class="tu-dot${i===tuIdx?' on':''}"></div>`).join('')}</div>
    <button class="btn" onclick="nextTu()">${s.btn}</button>`;
}
function nextTu(){tuIdx++;if(tuIdx>=tuSteps.length){document.getElementById('tutorial').style.display='none';goTab('profile');toast('🎉 Perfil criado! Agora anuncie seu primeiro produto.');}else renderTuStep();}

// ═══════ FEED ═══════
function renderCategories(){
  const cats=['Todos','Eletrônicos','Móveis','Veículos','Roupas','Esportes','Casa','Ferramentas'];
  document.getElementById('catBar').innerHTML=cats.map((c,i)=>`<span class="cat-chip${i===0?' on':''}" onclick="selCat('${c}',this)">${c}</span>`).join('');
}
function selCat(c,el){
  activeCat=c;document.querySelectorAll('.cat-chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  document.getElementById('fTitle').textContent=c==='Todos'?'Todos os produtos':c;renderFeed();
}
function renderFeed(){
  const q=(document.getElementById('fSearch')?.value||'').toLowerCase();
  let f=activeCat==='Todos'?products:products.filter(p=>p.category===activeCat);
  if(q)f=f.filter(p=>p.title.toLowerCase().includes(q)||(p.city||'').toLowerCase().includes(q));
  document.getElementById('fCount').textContent=f.length+' itens';
  document.getElementById('fGrid').innerHTML=f.map(p=>`
    <div class="card" onclick="openDetail('${p.id}')">
      <div class="img-wrap">
        <img src="${(p.images&&p.images[0])||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'}" alt="${p.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'">
        <div class="c-grad"></div>
      </div><div class="c-body"><span class="c-title">${p.title}</span><span class="c-price">R$ ${p.price.toLocaleString('pt-BR')}</span><span class="c-loc"><span class="c-dot"></span>${p.city}</span></div>
    </div>`).join('');
}

// ═══════ DETAIL ═══════
function openDetail(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  const imgs=p.images&&p.images.length?p.images:['https://images.unsplash.com/photo-1560343090-f0409e92791a?w=600&h=450&fit=crop'];
  const rel=products.filter(x=>x.id!==id&&(x.category===p.category||x.city===p.city)).slice(0,4);
  document.getElementById('dContent').innerHTML=`
    <img src="${imgs[0]}" class="d-img" onerror="this.src='https://images.unsplash.com/photo-1560343090-f0409e92791a?w=600&h=450&fit=crop'">
    <div class="d-info"><div class="d-price">R$ ${p.price.toLocaleString('pt-BR')}</div><div class="d-title">${p.title}</div><div class="d-desc">${p.desc||'Sem descrição.'}</div><div class="d-tags"><span>📦 ${p.category}</span><span>📍 ${p.city}</span></div></div>
    <div class="d-seller"><div class="ds-av">${(p.seller||'V')[0]}</div><div><div class="ds-name">${p.seller||'Vendedor'}</div><div class="ds-sub">⭐ ${p.stars||'4.5'} · Membro desde 2026</div></div></div>
    ${rel.length?`<div class="d-related"><h4>Produtos relacionados</h4><div class="rel-grid">${rel.map(r=>`<div class="card" onclick="openDetail('${r.id}')"><div class="img-wrap"><img src="${(r.images&&r.images[0])||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'}"><div class="c-grad"></div></div><div class="c-body"><span class="c-title">${r.title}</span><span class="c-price">R$ ${r.price.toLocaleString('pt-BR')}</span></div></div>`).join('')}</div></div>`:''}
    ${p.whatsapp?`<div class="d-wa"><a href="https://wa.me/55${p.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent('Olá! Vi o anúncio "'+p.title+'" no Acha Região')}" target="_blank"><button>💬 Chamar no WhatsApp</button></a></div>`:''}
  `;
  document.querySelectorAll('.page').forEach(p=>p.classList.add('right'));
  document.getElementById('detail').classList.remove('right');
  currentPage='detail';
}

// ═══════ CREATE ═══════
function addPhotos(e){Array.from(e.target.files).forEach(f=>{const r=new FileReader();r.onload=ev=>{photos.push(ev.target.result);renderPhotos()};r.readAsDataURL(f)})}
function renderPhotos(){
  const c=document.querySelector('.photo-row');
  c.innerHTML=photos.map((url,i)=>`<div class="photo-slot"><img src="${url}"><span class="del" onclick="removePhoto(${i})">✕</span></div>`).join('')+`<div class="photo-slot" onclick="document.getElementById('pInput').click()">+</div>`;
}
function removePhoto(i){photos.splice(i,1);renderPhotos()}

function publish(){
  if(!user){goTab('auth');return}
  const t=document.getElementById('cTitle').value.trim(),d=document.getElementById('cDesc').value.trim(),p=document.getElementById('cPrice').value;
  if(!t){toast('⚠️ Título obrigatório');return}if(!d){toast('⚠️ Descrição obrigatória');return}if(!p){toast('⚠️ Preço obrigatório');return}
  const prod={id:'local_'+Date.now(),title:t,desc:d,price:parseInt(p),category:document.getElementById('cCat').value,city:document.getElementById('cCity').value,images:photos.length?photos:['https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'],sellerId:user.id,seller:user.name,stars:user.stars||4.5,createdAt:new Date().toISOString()};
  products.unshift(prod);
  const local=JSON.parse(localStorage.getItem('acha_products')||'[]');local.push(prod);localStorage.setItem('acha_products',JSON.stringify(local));
  document.getElementById('cTitle').value='';document.getElementById('cDesc').value='';document.getElementById('cPrice').value='';photos=[];renderPhotos();
  goTab('feed');toast('✅ Anúncio publicado!');
}

// ═══════ PROFILE ═══════
function renderProfile(){
  if(!user)return;
  document.getElementById('profName').textContent=user.name;document.getElementById('profLoc').textContent='📍 '+(user.city||'Alto Vale');
  const mine=products.filter(p=>p.sellerId===user.id);
  document.getElementById('profGrid').innerHTML=mine.length?mine.map(p=>`<div class="card" onclick="openDetail('${p.id}')"><div class="img-wrap"><img src="${(p.images&&p.images[0])||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'}"><div class="c-grad"></div></div><div class="c-body"><span class="c-title">${p.title}</span><span class="c-price">R$ ${p.price.toLocaleString('pt-BR')}</span></div></div>`).join(''):'<div class="prof-empty"><div class="pe">📦</div><p style="font-size:13px;color:var(--t2)">Nenhum anúncio ainda</p><p style="font-size:11px;color:var(--t3)">Vá em Anunciar para criar seu primeiro!</p></div>';
}
function profSwitch(t,el){document.querySelectorAll('.prof-tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');}

// ═══════ UTILS ═══════
function install(){if(window._pwa){window._pwa.prompt();document.getElementById('installBar').classList.remove('show')}else toast('📲 iPhone: Safari → Compartilhar → Adicionar à Tela')}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),2600)}
</script>
