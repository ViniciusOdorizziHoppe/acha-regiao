<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Acha Região</title>
<meta name="theme-color" content="#F5C518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/logo-icon.png">
<link rel="apple-touch-icon" href="assets/logo-icon.png">
<link rel="manifest" href="data:application/json,{name:'Acha Região',short_name:'Acha',start_url:'.',display:'standalone',background_color:'%2309090B',theme_color:'%23F5C518',icons:[{src:'assets/logo-icon.png',sizes:'192x192'},{src:'assets/logo-icon.png',sizes:'512x512'}]}">
<style>
:root{--y:#F5C518;--yd:#D4A800;--yg:rgba(245,197,24,.10);--bg:#09090B;--s:#141417;--c:#1A1A1E;--b:#27272C;--t:#F5F5F7;--t2:#A1A1AA;--t3:#6B6B70;--r:14px;--g:#25D366;--red:#EF4444;--safe:env(safe-area-inset-bottom,8px)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:Inter,-apple-system,sans-serif;overflow:hidden;height:100dvh;-webkit-font-smoothing:antialiased;touch-action:manipulation}
#root{max-width:500px;margin:0 auto;height:100dvh;position:relative;overflow:hidden;background:var(--bg)}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .35s;overflow-y:auto;overflow-x:hidden;will-change:transform}
.page.right{transform:translateX(105%);opacity:.5;pointer-events:none}
.page.pop{transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s}
.page.hide{opacity:0;pointer-events:none;transform:none}

/* ═══ SPLASH ═══ */
#splash{justify-content:center;align-items:center;z-index:99}
.splash-logo{animation:popIn .6s cubic-bezier(.34,1.56,.64,1)}
.splash-logo img{height:72px}
.splash-sub{font-size:11px;color:var(--t3);letter-spacing:4px;text-transform:uppercase;text-align:center;margin-top:6px}
.splash-ring{width:44px;height:44px;border:3px solid var(--y);border-radius:50%;border-top-color:transparent;animation:spin 1s linear infinite;margin-top:28px}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══ AUTH ═══ */
.auth-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 28px}
.auth-wrap img{height:44px;align-self:center;margin-bottom:28px}
.auth-wrap h1{font-size:24px;font-weight:900;text-align:center;margin-bottom:4px;letter-spacing:-0.5px}
.auth-wrap h1 em{font-style:normal;color:var(--y)}
.auth-wrap .sub{font-size:13px;color:var(--t3);text-align:center;margin-bottom:28px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fld input{width:100%;padding:12px 14px;background:var(--c);border:1px solid var(--b);border-radius:var(--r);color:var(--t);font-size:14px;outline:none;font-family:inherit;transition:border .2s}
.fld input:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--yg)}
.btn{width:100%;padding:14px;background:var(--y);color:#1A1800;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s,transform .15s;letter-spacing:-0.2px}
.btn:active{opacity:.85;transform:scale(.98)}
.switch{text-align:center;margin-top:18px;font-size:12px;color:var(--t2)}
.switch b{color:var(--y);cursor:pointer}
.err{color:var(--red);font-size:12px;text-align:center;min-height:18px;margin-top:6px}

/* ═══ TUTORIAL ═══ */
#tutorial-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:28px}
.tu-card{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:32px 24px;max-width:340px;text-align:center;animation:tuPop .4s cubic-bezier(.34,1.56,.64,1)}
.tu-icon{font-size:52px;margin-bottom:14px}
.tu-card h2{font-size:19px;font-weight:800;margin-bottom:8px}
.tu-card h2 em{font-style:normal;color:var(--y)}
.tu-card p{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:22px}
.tu-dots{display:flex;gap:5px;justify-content:center;margin-bottom:20px}
.tu-dot{width:8px;height:8px;border-radius:4px;background:var(--b);transition:.2s}
.tu-dot.on{width:22px;background:var(--y)}
@keyframes tuPop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ═══ YELLOW HEADER ═══ */
.yh{background:linear-gradient(135deg,var(--y),#FFD42A,var(--y));padding:14px 16px 16px;position:relative;overflow:hidden;flex-shrink:0}
.yh::after{content:'';position:absolute;top:-12px;right:-12px;width:90px;height:90px;background:radial-gradient(circle,rgba(0,0,0,.04) 1px,transparent 1px);background-size:7px 7px;opacity:.3}
.yh-row{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:12px}
.yh-row img{height:24px}
.search-bar{display:flex;align-items:center;background:#1A1A1E;border:2px solid rgba(245,197,24,.3);border-radius:12px;height:44px;padding:0 14px;gap:6px;position:relative;z-index:1;transition:.2s}
.search-bar:focus-within{border-color:var(--y);box-shadow:0 0 0 4px var(--yg)}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--t);font-size:13px}
.search-bar input::placeholder{color:var(--t3)}

/* ═══ CATEGORIES ═══ */
.cat-row{padding:10px 14px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.cat-row::-webkit-scrollbar{display:none}
.cat-chip{height:30px;padding:0 13px;border-radius:15px;font-size:11px;font-weight:700;border:1px solid var(--b);color:var(--t2);background:var(--s);cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;transition:.15s}
.cat-chip.on{background:var(--y);color:#1A1800;border-color:var(--y);box-shadow:0 2px 10px rgba(245,197,24,.25)}

/* ═══ RADIUS ═══ */
.radius-bar{padding:8px 14px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--b);flex-shrink:0}
.radius-bar span{font-size:11px;color:var(--t2);white-space:nowrap;font-weight:600}
.radius-bar input[type=range]{flex:1;accent-color:var(--y);height:4px}
.radius-bar .km-val{font-size:12px;font-weight:700;color:var(--y);min-width:55px;text-align:right}

/* ═══ SECTION ═══ */
.sec-bar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.sec-bar h3{font-size:15px;font-weight:700}
.sec-bar .sort-btn{font-size:11px;font-weight:700;color:var(--y);cursor:pointer;display:flex;align-items:center;gap:4px}

/* ═══ GRID ═══ */
.grid-scroll{flex:1;overflow-y:auto;padding:0 12px 90px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--c);border-radius:var(--r);overflow:hidden;border:1px solid var(--b);cursor:pointer;transition:transform .15s;position:relative;animation:fadeUp .35s ease both}
.card:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card .img-wrap{position:relative}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.card .fav-btn{position:absolute;top:8px;right:8px;z-index:5;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;border:none;transition:.15s;backdrop-filter:blur(4px)}
.card .fav-btn.on{background:var(--red)}
.card .c-badge{position:absolute;top:7px;left:7px;background:var(--y);padding:2px 7px;border-radius:5px;font-size:8px;font-weight:800;color:#1A1800;text-transform:uppercase}
.card .c-grad{position:absolute;bottom:0;left:0;right:0;height:26px;background:linear-gradient(transparent,rgba(26,26,30,.85))}
.card .c-body{padding:9px 10px;display:flex;flex-direction:column;gap:2px}
.card .c-title{font-size:11px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .c-price{font-size:16px;font-weight:800;color:var(--y);letter-spacing:-0.3px}
.card .c-loc{font-size:9px;color:var(--t3);display:flex;align-items:center;gap:4px}
.card .c-dist{font-size:8px;color:var(--y);margin-left:2px}
.card .c-dot{width:4px;height:4px;border-radius:50%;background:rgba(245,197,24,.35);flex-shrink:0}

/* ═══ DETAIL ═══ */
.d-back{position:absolute;top:14px;left:14px;z-index:15;background:rgba(0,0,0,.55);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;border:none;backdrop-filter:blur(8px)}
.d-scroll{flex:1;overflow-y:auto;padding-bottom:100px}
.carousel{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:#000;touch-action:pan-y}
.carousel .slides{display:flex;height:100%;transition:transform .3s ease}
.carousel .slides img{width:100%;height:100%;object-fit:cover;flex-shrink:0}
.carousel .c-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:5}
.carousel .c-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);transition:.2s}
.carousel .c-dot.on{background:var(--y);width:18px;border-radius:3px}
.carousel .c-counter{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;z-index:5;backdrop-filter:blur(4px)}
.carousel .c-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:5;backdrop-filter:blur(4px)}
.carousel .c-prev{left:8px}.carousel .c-next{right:8px}

.d-info{padding:18px 16px}.d-price{font-size:28px;font-weight:900;color:var(--y);margin-bottom:4px}.d-title{font-size:17px;font-weight:700;margin-bottom:6px}.d-desc{font-size:13px;color:var(--t2);line-height:1.55;margin-bottom:14px}.d-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.d-tags span{background:var(--s);padding:5px 10px;border-radius:7px;font-size:11px;color:var(--t2);font-weight:600}
.d-seller{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px;margin:0 16px 18px}
.d-seller .ds-av{width:44px;height:44px;border-radius:50%;background:var(--y);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#1A1800;flex-shrink:0}
.d-seller .ds-name{font-size:13px;font-weight:700}.d-seller .ds-sub{font-size:11px;color:var(--t3)}
.d-related{padding:0 16px 20px}.d-related h4{font-size:14px;font-weight:700;margin-bottom:10px}.rel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.d-actions{padding:16px;display:flex;gap:10px}.wa-btn{flex:1;padding:15px;background:var(--g);color:#fff;border:none;border-radius:var(--r);font-weight:700;font-size:14px;cursor:pointer}.sh-btn,.fav-lg{width:50px;background:var(--s);border:1px solid var(--b);border-radius:var(--r);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}.fav-lg.on{background:var(--red);border-color:var(--red);color:#fff}

/* ═══ CREATE ═══ */
.create-scroll{flex:1;overflow-y:auto;padding:18px 16px}
.create-scroll h2{font-size:19px;font-weight:800;margin-bottom:20px}.create-scroll h2 em{font-style:normal;color:var(--y)}
.photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.photo-slot{width:82px;height:82px;border:2px dashed var(--b);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--t3);cursor:pointer;overflow:hidden;position:relative}
.photo-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-slot .del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.cf label{display:block;font-size:11px;font-weight:700;color:var(--t2);margin-bottom:4px;margin-top:14px;text-transform:uppercase;letter-spacing:.5px}
.cf label .req{color:var(--red)}
.cf input,.cf textarea,.cf select{width:100%;padding:11px 14px;background:var(--c);border:1px solid var(--b);border-radius:var(--r);color:var(--t);font-size:13px;outline:none;font-family:inherit;transition:.2s}
.cf input:focus,.cf textarea:focus,.cf select:focus{border-color:var(--y);box-shadow:0 0 0 3px var(--yg)}
.cf textarea{height:90px;resize:none}

/* ═══ PROFILE ═══ */
.prof-cover{height:130px;background:linear-gradient(135deg,var(--y),#FFD42A);position:relative;flex-shrink:0}
.prof-av{width:76px;height:76px;border-radius:50%;background:var(--c);border:3px solid var(--bg);margin-top:-38px;margin-left:20px;display:flex;align-items:center;justify-content:center;font-size:30px;position:relative;z-index:2;flex-shrink:0}
.prof-info{padding:12px 20px;margin-bottom:16px;flex-shrink:0}
.prof-info h2{font-size:19px;font-weight:800;margin-bottom:2px}.prof-info .ploc{font-size:12px;color:var(--t3);margin-bottom:8px}.prof-stars{display:flex;gap:1px}.prof-stars span{font-size:16px}
.prof-tab-row{display:flex;border-bottom:1px solid var(--b);margin:0 18px;flex-shrink:0}
.prof-tab{flex:1;text-align:center;padding:12px 0;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent}.prof-tab.on{color:var(--y);border-bottom-color:var(--y)}
.prof-grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;overflow-y:auto}
.prof-empty{grid-column:1/-1;text-align:center;padding:40px 20px;color:var(--t3)}

/* ═══ TAB BAR ═══ */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:58px;background:#0C0C10;border-top:2px solid var(--y);display:flex;justify-content:space-around;align-items:center;padding-bottom:var(--safe);z-index:50;backdrop-filter:blur(12px)}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:700;color:var(--t3);cursor:pointer;border:none;background:none;padding:4px 0;position:relative}
.tab-item.on{color:var(--y)}
.tab-item .ti{font-size:18px}
.tab-item .badge-dot{position:absolute;top:0;right:2px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ═══ TOAST ═══ */
.toast-ctr{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:400}
.toast{background:var(--s);border:1px solid var(--b);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;color:var(--t);box-shadow:0 8px 28px rgba(0,0,0,.5);animation:toastIn .3s ease;white-space:nowrap}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

#installBar{display:none;position:fixed;bottom:75px;left:50%;transform:translateX(-50%);z-index:60;background:var(--y);color:#1A1800;padding:12px 22px;border-radius:14px;font-weight:700;font-size:12px;cursor:pointer;box-shadow:0 4px 20px rgba(245,197,24,.35);white-space:nowrap}
#installBar.show{display:block}
</style>
</head>
<body>
<div id="root">

<!-- SPLASH -->
<div class="page" id="splash">
  <div class="splash-logo"><img src="assets/logo-text.png" alt="Acha Região" onerror="this.outerHTML='<div style=font-size:26px;font-weight:900;color:var(--y);text-align:center>acha<span style=font-size:9px;color:var(--t3)>REGIÃO</span></div>'"><div class="splash-sub">Alto Vale do Itajaí</div></div>
  <div class="splash-ring"></div>
</div>

<!-- AUTH -->
<div class="page right" id="auth">
  <div class="auth-wrap">
    <img src="assets/logo-text.png" alt="Acha Região" onerror="this.style.display='none'">
    <h1>Bem-vindo ao <em>Acha</em></h1><p class="sub">O marketplace da nossa região</p>
    <div id="regForm"><div class="fld"><label>Nome completo</label><input type="text" id="rName" placeholder="Seu nome"></div><div class="fld"><label>Email</label><input type="email" id="rEmail" placeholder="seu@email.com"></div><div class="fld"><label>Senha</label><input type="password" id="rPass" placeholder="Mínimo 6 caracteres"></div><div class="err" id="rErr"></div><button class="btn" onclick="doRegister()">Criar conta</button><p class="switch">Já tem conta? <b onclick="toggleAuth()">Entrar</b></p></div>
    <div id="loginForm" style="display:none"><div class="fld"><label>Email</label><input type="email" id="lEmail" placeholder="seu@email.com"></div><div class="fld"><label>Senha</label><input type="password" id="lPass" placeholder="Sua senha"></div><div class="err" id="lErr"></div><button class="btn" onclick="doLogin()">Entrar</button><p class="switch">Não tem conta? <b onclick="toggleAuth()">Criar conta</b></p></div>
  </div>
</div>

<!-- FEED -->
<div class="page right" id="feed">
  <div class="yh"><div class="yh-row"><img src="assets/logo-text.png" alt="Acha Região" onerror="this.outerHTML='<b style=font-size:18px;color:#1A1800>acha</b>'"><span id="notifBadge" style="display:none;background:#EF4444;color:#fff;border-radius:10px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer" onclick="showNewAlert()">🔔</span></div><div class="search-bar"><span style="font-size:15px">🔍</span><input type="text" id="fSearch" placeholder="Buscar produtos..." oninput="renderFeed()"></div></div>
  <div class="cat-row" id="catBar"></div>
  <div class="radius-bar"><span>📍 Raio:</span><input type="range" id="radiusSlider" min="5" max="100" value="100" step="5" oninput="updateRadius(this.value)"><span class="km-val" id="kmVal">Toda região</span></div>
  <div class="sec-bar"><h3 id="fTitle">Todos os produtos</h3><span class="sort-btn" onclick="toggleSort()" id="sortLabel">🕐 Recentes</span></div>
  <div class="grid-scroll"><div class="grid-2" id="fGrid"></div></div>
  <div class="tab-bar" id="tabFeed"><button class="tab-item on" onclick="goTab('feed')"><span class="ti">🏷️</span>Explorar</button><button class="tab-item" onclick="goTab('create')"><span class="ti">📦</span>Anunciar</button><button class="tab-item" onclick="goTab('profile')"><span class="ti">👤</span>Perfil</button></div>
</div>

<!-- CREATE -->
<div class="page right" id="create">
  <div class="yh"><div class="yh-row"><b style="font-size:18px;color:#1A1800">📦 Novo anúncio</b></div></div>
  <div class="create-scroll">
    <div class="photo-row"><div class="photo-slot" onclick="document.getElementById('pInput').click()">+</div></div><input type="file" id="pInput" accept="image/*" multiple hidden onchange="addPhotos(event)">
    <div class="cf">
      <label>Título <span class="req">*</span></label><input type="text" id="cTitle" placeholder="Ex: iPhone 12 128GB Branco" maxlength="100">
      <label>Descrição <span class="req">*</span></label><textarea id="cDesc" placeholder="Descreva: estado, tempo de uso, acessórios inclusos, garantia, formas de pagamento..."></textarea>
      <label>Preço (R$) <span class="req">*</span></label><input type="number" id="cPrice" placeholder="1679" min="0">
      <label>WhatsApp <span class="req">*</span></label><input type="tel" id="cWhats" placeholder="(47) 99999-9999">
      <label>Categoria</label><select id="cCat"><option>Eletrônicos</option><option>Móveis</option><option>Veículos</option><option>Roupas</option><option>Esportes</option><option>Casa</option><option>Ferramentas</option></select>
      <label>Localização <span class="req">*</span></label><select id="cCity"><option>Presidente Getúlio</option><option>Rio do Sul</option><option>Ibirama</option><option>Laurentino</option><option>Lontras</option><option>Aurora</option></select>
      <button class="btn" style="margin-top:22px" onclick="publish()">📢 Publicar anúncio</button>
    </div>
  </div>
  <div class="tab-bar" id="tabCreate"><button class="tab-item" onclick="goTab('feed')"><span class="ti">🏷️</span>Explorar</button><button class="tab-item on" onclick="goTab('create')"><span class="ti">📦</span>Anunciar</button><button class="tab-item" onclick="goTab('profile')"><span class="ti">👤</span>Perfil</button></div>
</div>

<!-- PROFILE -->
<div class="page right" id="profile">
  <div class="prof-cover"></div><div class="prof-av">👤</div>
  <div class="prof-info"><h2 id="profName"></h2><p class="ploc" id="profLoc"></p><div class="prof-stars" id="profStars"></div></div>
  <div class="prof-tab-row"><div class="prof-tab on" onclick="profSwitch('posts',this)">Meus anúncios</div><div class="prof-tab" onclick="profSwitch('favs',this)">❤️ Favoritos</div></div>
  <div class="prof-grid" id="profGrid"></div>

// ═══════ HAVERSINE ═══════
function haversine(lat1,lon1,lat2,lon2){const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180,a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function userCoords(){const city=user?.cidade||user?.city;if(city&&CITIES[city])return CITIES[city];return CITIES['Presidente Getúlio']}
function distanceTo(city){if(!CITIES[city])return 999;const[u1,u2]=userCoords();const[c1,c2]=CITIES[city];return haversine(u1,u2,c1,c2)}

// ═══════ NAVIGATION (FIXED) ═══════
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)&&dx>0&&currentPage==='detail')goTab('feed')});

function syncTabs(activePage){
  // Sync ALL tab bars across all pages to highlight the correct tab
  const tabIds=['tabFeed','tabCreate','tabProfile','tabDetail'];
  const tabMap={feed:0,create:1,profile:2};
  tabIds.forEach(tabId=>{
    const bar=document.getElementById(tabId);if(!bar)return;
    const items=bar.querySelectorAll('.tab-item');
    items.forEach((item,i)=>{item.classList.toggle('on',i===tabMap[activePage])});
  });
}

function goTab(page){
  if((page==='feed'||page==='create'||page==='profile')&&!user){page='auth'}
  if(page===currentPage)return;
  
  const prev=document.getElementById(currentPage);
  const next=document.getElementById(page);
  
  // Animate out
  if(prev)prev.classList.add(currentPage==='detail'&&page==='feed'?'pop':'right');
  // Animate in
  if(next){next.classList.remove('right','hide','pop');next.scrollTop=0}
  
  currentPage=page;
  slideIdx=0;
  syncTabs(page==='auth'||page==='detail'?'feed':page);
  
  if(page==='feed')renderFeed();
  if(page==='profile')renderProfile();
}

// ═══════ AUTH ═══════
function toggleAuth(){const r=document.getElementById('regForm'),l=document.getElementById('loginForm');r.style.display=r.style.display==='none'?'block':'none';l.style.display=l.style.display==='none'?'block':'none';document.getElementById('rErr').textContent='';document.getElementById('lErr').textContent=''}
async function doRegister(){

  if(!e.includes('@')){document.getElementById('rErr').textContent='Email inválido';return}
  const res=await fetch(API_BASE+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome:n,email:e,senha:p})});
  const d=await res.json();
  if(res.ok){user=d.user;token=d.token;localStorage.setItem('acha_token',token);localStorage.setItem('acha_user',JSON.stringify(user));showTutorial()}
  else{document.getElementById('rErr').textContent=d.error||'Erro ao cadastrar'}
}

  const e=document.getElementById('lEmail').value.trim(),p=document.getElementById('lPass').value;

// ═══════ TUTORIAL ═══════
const tuSteps=[{icon:'👤',title:'Seu <em>Perfil</em>',text:'Sua identidade no Acha Região. Suas estrelas representam sua reputação.',btn:'Próximo'},{icon:'⭐',title:'Suas <em>Estrelas</em>',text:'Ao vender produtos, os compradores te avaliam. Quanto mais ⭐, mais confiança!',btn:'Entendi'},{icon:'📦',title:'Seus <em>Anúncios</em>',text:'Liste tudo o que quer vender. Fotos, preço, descrição e localização — completo vende mais rápido!',btn:'Começar!'}];

function renderTuStep(){const s=tuSteps[tuIdx];document.getElementById('tuInner').innerHTML=`<div class="tu-icon">${s.icon}</div><h2>${s.title}</h2><p>${s.text}</p><div class="tu-dots">${tuSteps.map((_,i)=>`<div class="tu-dot${i===tuIdx?' on':''}"></div>`).join('')}</div><button class="btn" onclick="nextTu()">${s.btn}</button>`}
function nextTu(){tuIdx++;if(tuIdx>=tuSteps.length){document.getElementById('tutorial-overlay').style.display='none';goTab('profile');toast('🎉 Agora anuncie seu primeiro produto!')}else renderTuStep()}

// ═══════ FEED ═══════
function renderCategories(){const cats=['Todos','Eletrônicos','Móveis','Veículos','Roupas','Esportes','Casa','Ferramentas'];document.getElementById('catBar').innerHTML=cats.map((c,i)=>`<span class="cat-chip${i===0?' on':''}" onclick="selCat('${c}',this)">${c}</span>`).join('')}
function selCat(c,el){activeCat=c;document.querySelectorAll('.cat-chip').forEach(x=>x.classList.remove('on'));el.classList.add('on');document.getElementById('fTitle').textContent=c==='Todos'?'Todos os produtos':c;renderFeed()}
function updateRadius(v){radiusKm=parseInt(v);document.getElementById('kmVal').textContent=v==='100'?'Toda região':v+' km';renderFeed()}
function toggleSort(){sortNew=!sortNew;document.getElementById('sortLabel').textContent=sortNew?'🕐 Recentes':'💰 Menor preço';renderFeed()}

function renderFeed(){
  const q=(document.getElementById('fSearch')?.value||'').toLowerCase();
  let f=activeCat==='Todos'?[...products]:products.filter(p=>p.category===activeCat);
  if(q)f=f.filter(p=>p.title.toLowerCase().includes(q)||(p.city||'').toLowerCase().includes(q));
  if(radiusKm<100)f=f.filter(p=>distanceTo(p.city)<=radiusKm);
  if(sortNew)f.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));else f.sort((a,b)=>a.price-b.price);
  document.getElementById('fGrid').innerHTML=f.map(p=>{const dist=distanceTo(p.city),isFav=favorites.includes(p.id);return`<div class="card" onclick="openDetail('${p.id}')"><div class="img-wrap"><img src="${(p.images&&p.images[0])||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'}" alt="${p.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'"><button class="fav-btn${isFav?' on':''}" onclick="event.stopPropagation();toggleFav('${p.id}',this)">${isFav?'❤️':'🤍'}</button><div class="c-grad"></div></div><div class="c-body"><span class="c-title">${p.title}</span><span class="c-price">R$ ${p.price.toLocaleString('pt-BR')}</span><span class="c-loc"><span class="c-dot"></span>${p.city}${dist<100?`<span class="c-dist">· ${Math.round(dist)}km</span>`:''}</span></div></div>`}).join('');
  syncTabs('feed');
}

// ═══════ DETAIL (FIXED CAROUSEL) ═══════
let carouselCleanup=null;
function openDetail(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  if(carouselCleanup)carouselCleanup();
  const imgs=p.images&&p.images.length?p.images:['https://images.unsplash.com/photo-1560343090-f0409e92791a?w=600&h=450&fit=crop'];
  const rel=products.filter(x=>x.id!==id&&(x.category===p.category||x.city===p.city)).slice(0,4);
  const dist=distanceTo(p.city),isFav=favorites.includes(p.id),sname=p.seller_name||p.seller||'Vendedor',sstars=p.seller_stars||p.stars||4.5;
  slideIdx=0;

  document.getElementById('dContent').innerHTML=`
    <div class="carousel" id="carousel"><div class="slides" id="carouselSlides" style="transform:translateX(0)">${imgs.map((img,i)=>`<img src="${img}" onerror="this.src='https://images.unsplash.com/photo-1560343090-f0409e92791a?w=600&h=450&fit=crop'" data-idx="${i}">`).join('')}</div>${imgs.length>1?`<button class="c-nav c-prev" onclick="slideCarousel(-1)">‹</button><button class="c-nav c-next" onclick="slideCarousel(1)">›</button><div class="c-dots">${imgs.map((_,i)=>`<span class="c-dot${i===0?' on':''}"></span>`).join('')}</div><span class="c-counter">1/${imgs.length}</span>`:''}</div>
    <div class="d-info"><div class="d-price">R$ ${p.price.toLocaleString('pt-BR')}</div><div class="d-title">${p.title}</div><div class="d-desc">${(p.desc||'Sem descrição.').replace(/\n/g,'<br>')}</div><div class="d-tags"><span>📦 ${p.category}</span><span>📍 ${p.city}</span>${dist<100?`<span>📏 ${Math.round(dist)} km</span>`:''}</div></div>
    <div class="d-seller"><div class="ds-av">${(sname||'V')[0]}</div><div><div class="ds-name">${sname}</div><div class="ds-sub">⭐ ${sstars} · Membro desde 2026</div></div></div>
    ${rel.length?`<div class="d-related"><h4>Produtos relacionados</h4><div class="rel-grid">${rel.map(r=>`<div class="card" onclick="openDetail('${r.id}')"><div class="img-wrap"><img src="${(r.images&&r.images[0])||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'}"><div class="c-grad"></div></div><div class="c-body"><span class="c-title">${r.title}</span><span class="c-price">R$ ${r.price.toLocaleString('pt-BR')}</span></div></div>`).join('')}</div></div>`:''}
    <div class="d-actions"><button class="wa-btn" onclick="openWhatsApp('${p.id}')">💬 Chamar no WhatsApp</button><button class="fav-lg${isFav?' on':''}" onclick="toggleFav('${p.id}',this)">${isFav?'❤️':'🤍'}</button><button class="sh-btn" onclick="shareProduct('${p.id}')">📤</button></div>`;

  // Carousel touch — using single listener with cleanup
  if(imgs.length>1){
    const slides=document.getElementById('carouselSlides');
    if(slides){
      let startX=0;
      const onStart=e=>{startX=e.touches[0].clientX};
      const onEnd=e=>{const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>40)slideCarousel(dx<0?1:-1)};
      slides.addEventListener('touchstart',onStart,{passive:true});
      slides.addEventListener('touchend',onEnd,{passive:true});
      carouselCleanup=()=>{slides.removeEventListener('touchstart',onStart);slides.removeEventListener('touchend',onEnd)};
    }
  }else{carouselCleanup=null}

  document.querySelectorAll('.page').forEach(p=>p.classList.add('right'));
  document.getElementById('detail').classList.remove('right','pop');
  currentPage='detail';
  syncTabs('feed');
}

function slideCarousel(dir){
  const slides=document.getElementById('carouselSlides');if(!slides)return;
  const imgs=slides.querySelectorAll('img');if(!imgs.length)return;
  slideIdx=Math.max(0,Math.min(imgs.length-1,slideIdx+dir));
  slides.style.transform=`translateX(-${slideIdx*100}%)`;
  document.querySelectorAll('.c-dot').forEach((d,i)=>d.classList.toggle('on',i===slideIdx));
  const c=document.querySelector('.c-counter');if(c)c.textContent=`${slideIdx+1}/${imgs.length}`;
}

  const p=products.find(x=>x.id===id);if(!p)return;
  const phone=p.whatsapp||'';if(!phone){toast('⚠️ WhatsApp não informado');return}
  const sname=p.seller_name||p.seller||'vendedor';
  window.open(`https://wa.me/55${phone.replace(/\D/g,'')}?text=${encodeURIComponent('Olá! Vi o anúncio "'+p.title+'" no Acha Região e tenho interesse.')}`,'_blank');
}
function shareProduct(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  window.open(`https://wa.me/?text=${encodeURIComponent('🟡 '+p.title+'\n💰 R$ '+p.price.toLocaleString('pt-BR')+'\n📍 '+p.city+'\n\nVeja no Acha Região: acha-regiao-qp7x.vercel.app')}`,'_blank');

async function toggleFav(id,el){

  }else{
    const favProducts=products.filter(p=>favorites.includes(p.id));
    grid.innerHTML=favProducts.length?favProducts.map(p=>`<div class="card" onclick="openDetail('${p.id}')"><div class="img-wrap"><img src="${(p.images&&p.images[0])||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=300&h=225&fit=crop'}"><div class="c-grad"></div></div><div class="c-body"><span class="c-title">${p.title}</span><span class="c-price">R$ ${p.price.toLocaleString('pt-BR')}</span></div></div>`).join(''):'<div class="prof-empty"><div style="font-size:44px;margin-bottom:10px">❤️</div><p style="font-size:13px;color:var(--t2)">Nenhum favorito</p><p style="font-size:11px;color:var(--t3)">Toque no 🤍 nos produtos para salvar!</p></div>';
  }
}

// ═══════ NOTIFICATIONS ═══════
function checkNewListings(){
  const local=JSON.parse(localStorage.getItem('acha_products')||'[]');
  const news=local.filter(p=>new Date(p.createdAt).getTime()>lastCheck);
  if(news.length>0&&user){document.getElementById('notifBadge').style.display='inline-block';document.getElementById('notifBadge').textContent=`🔔 ${news.length}`;
    if('Notification' in window&&Notification.permission==='granted'){news.forEach(p=>{new Notification('🟡 Novo anúncio',{body:`${p.title} — R$ ${p.price} em ${p.city}`,icon:'assets/logo-icon.png'})})}
  }
  lastCheck=Date.now();
}
function notifyNewListing(p){
  if('Notification' in window&&Notification.permission==='granted'){new Notification('🟡 Produto publicado!',{body:`${p.title} — R$ ${p.price} em ${p.city}`,icon:'assets/logo-icon.png'})}
}
function showNewAlert(){document.getElementById('notifBadge').style.display='none';toast('🔔 Novos produtos na sua região!')}

// ═══════ UTILS ═══════
function install(){if(window._pwa){window._pwa.prompt();document.getElementById('installBar').classList.remove('show')}else toast('📲 iPhone: Safari → Compartilhar → Adicionar à Tela')}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),2600)}
</script>
</body>
