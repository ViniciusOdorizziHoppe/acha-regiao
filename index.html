<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Acha Região</title>
<meta name="description" content="Marketplace local do Alto Vale do Itajaí">
<meta name="theme-color" content="#F5C518">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acha Região">
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="apple-touch-icon" href="assets/logo-icon.png">
<link rel="manifest" href="data:application/json,{name:'Acha Região',short_name:'Acha',start_url:'.',display:'standalone',background_color:'%2309090B',theme_color:'%23F5C518',icons:[{src:'assets/logo-icon.png',sizes:'192x192',type:'image/png'},{src:'assets/logo-icon.png',sizes:'512x512',type:'image/png'}]}">
<style>
:root {
  --y: #F5C518; --yg: rgba(245,197,24,.15); --bg: #09090B;
  --s: #131315; --c: #1A1A1E; --b: #27272C;
  --t: #F5F5F7; --t2: #A1A1AA; --t3: #6B6B70;
  --g: #25D366; --r: 14px; --safe: env(safe-area-inset-bottom,8px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:Inter,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:hidden}
#app{max-width:500px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}

/* PWA Install Banner */
#installBanner{display:none;background:linear-gradient(135deg,var(--y),#FFD42A);padding:12px 16px;align-items:center;gap:12px;position:fixed;bottom:0;left:0;right:0;z-index:100;animation:slideUp .3s ease}
#installBanner.show{display:flex}
#installBanner .txt{flex:1;font-size:13px;font-weight:700;color:#1A1800}
#installBanner button{background:#1A1800;color:var(--y);border:none;padding:8px 16px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
#installBanner .close{background:none;border:none;color:#1A1800;font-size:18px;cursor:pointer;padding:4px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* Header */
.header{background:linear-gradient(135deg,var(--y),#FFD42A,var(--y));padding:12px 16px 14px;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;top:-10px;right:-10px;width:80px;height:80px;background:radial-gradient(circle,rgba(0,0,0,.05) 1px,transparent 1px);background-size:7px 7px;opacity:.35}
.h-top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:10px}
.h-top img{height:26px}
.h-loc{background:rgba(0,0,0,.07);padding:4px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#1A1800;cursor:pointer}
.search-box{display:flex;align-items:center;background:#1E1E22;border:2px solid rgba(245,197,24,.35);border-radius:11px;height:42px;padding:0 12px;gap:6px;position:relative;z-index:1;box-shadow:0 0 18px rgba(245,197,24,.08)}
.search-box:focus-within{border-color:var(--y)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--t);font-size:13px;min-width:0}
.search-box input::placeholder{color:var(--t3)}

/* Content */
.content{flex:1;overflow-y:auto;padding-bottom:70px}
.cats{padding:10px 12px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{height:30px;padding:0 13px;border-radius:15px;font-size:11px;font-weight:700;border:1px solid var(--b);color:var(--t2);background:var(--c);cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center}
.cat.on{background:var(--y);color:#1A1800;border-color:var(--y);box-shadow:0 3px 12px rgba(245,197,24,.2)}
.sec{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.sec h2{font-size:15px;font-weight:700}
.sec span{font-size:12px;font-weight:700;color:var(--y)}
.grid{padding:0 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{background:var(--c);border-radius:var(--r);overflow:hidden;border:1px solid var(--b);cursor:pointer;transition:transform .12s,box-shadow .12s;animation:in .3s ease both}
.prod:hover{transform:translateY(-2px);box-shadow:0 6px 20px var(--yg)}
.prod:nth-child(1){animation-delay:0s}.prod:nth-child(2){animation-delay:.04s}.prod:nth-child(3){animation-delay:.08s}.prod:nth-child(4){animation-delay:.12s}.prod:nth-child(5){animation-delay:.16s}.prod:nth-child(6){animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.prod .pw{position:relative}
.prod img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.prod .badge{position:absolute;top:6px;left:6px;background:var(--y);padding:2px 6px;border-radius:4px;font-size:8px;font-weight:800;color:#1A1800;text-transform:uppercase}
.prod .po{position:absolute;bottom:0;left:0;right:0;height:25px;background:linear-gradient(transparent,rgba(26,26,30,.8))}
.prod .pb{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.prod .pt{font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .pp{font-size:16px;font-weight:800;color:var(--y)}
.prod .pc{font-size:9px;color:var(--t3);display:flex;align-items:center;gap:3px}
.prod .pd{width:4px;height:4px;border-radius:50%;background:rgba(245,197,24,.35)}

/* Tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;height:56px;background:#0F0F11;border-top:2px solid var(--y);display:flex;justify-content:space-around;align-items:center;padding-bottom:var(--safe);z-index:50;box-shadow:0 -4px 14px rgba(245,197,24,.05)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:700;color:var(--t3);cursor:pointer;transition:color .15s;border:none;background:none;padding:4px 0}
.tab.on{color:var(--y)}
.tab .ti{font-size:18px}

/* Fab */
.fab{position:fixed;bottom:72px;right:calc(50% - 230px);width:48px;height:48px;background:var(--y);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#1A1800;box-shadow:0 4px 20px rgba(245,197,24,.35);cursor:pointer;z-index:40;border:none;transition:transform .15s}
.fab:active{transform:scale(.9)}
@media(max-width:500px){.fab{right:12px}}

/* Modal */
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal .backdrop{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7)}
.modal .sheet{position:relative;background:var(--s);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:85vh;overflow-y:auto;padding:20px 16px;animation:su .25s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:16px}
.sheet h3 span{color:var(--y)}
.sheet label{display:block;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px;margin-top:12px}
.sheet input,.sheet textarea,.sheet select{width:100%;padding:10px 12px;background:var(--c);border:1px solid var(--b);border-radius:10px;color:var(--t);font-size:13px;outline:none;font-family:inherit}
.sheet input:focus,.sheet textarea:focus{border-color:var(--y)}
.sheet textarea{height:80px;resize:none}
.sheet .btn{width:100%;padding:12px;background:var(--y);color:#1A1800;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px}
.sheet .btn:disabled{opacity:.5}
.sheet .close-btn{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer}

/* Detail modal */
.detail-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:14px}
.detail-price{font-size:24px;font-weight:900;color:var(--y);margin-bottom:4px}
.detail-title{font-size:18px;font-weight:700;margin-bottom:6px}
.detail-desc{font-size:13px;color:var(--t2);line-height:1.5;margin-bottom:14px}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.detail-meta span{background:var(--c);padding:5px 10px;border-radius:6px;font-size:11px;color:var(--t2)}
.wp-btn{width:100%;padding:14px;background:var(--g);color:#fff;border:none;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--c);border:1px solid var(--b);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:td .3s ease;pointer-events:none}
@keyframes td{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.toast.ok{border-color:#4ADE80;color:#4ADE80}

/* Auth */
.auth-btns{display:flex;gap:8px;position:relative;z-index:1}
.auth-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid rgba(0,0,0,.15);background:rgba(0,0,0,.06);color:#1A1800}

/* Empty */
.empty{text-align:center;padding:40px 20px}
.empty .ei{font-size:48px;margin-bottom:12px}
.empty h3{font-size:16px;font-weight:700;margin-bottom:4px}
.empty p{font-size:12px;color:var(--t3)}
</style>
</head>
<body>
<div id="app">
  <!-- INSTALL BANNER -->
  <div id="installBanner">
    <span class="txt">📲 Adicione à tela inicial</span>
    <button onclick="installPWA()">Instalar</button>
    <button class="close" onclick="this.parentElement.classList.remove('show')">✕</button>
  </div>

  <!-- HEADER -->
  <div class="header">
    <div class="h-top">
      <img src="assets/logo-text.png" alt="Acha Região" onerror="this.outerHTML='<b style=font-size:20px;color:#1A1800>acha <small style=font-size:9px>REGIÃO</small></b>'">
      <div style="display:flex;gap:6px">
        <span class="h-loc">📍 Alto Vale</span>
        <div class="auth-btns" id="authBtns">
          <button class="auth-btn" onclick="openModal('login')">Entrar</button>
        </div>
      </div>
    </div>
    <div class="search-box">
      <span style="font-size:14px">🔍</span>
      <input type="text" id="searchIpt" placeholder="O que você procura?" oninput="render()">
    </div>
  </div>

  <!-- CATEGORIES -->
  <div class="cats" id="catRow"></div>

  <!-- SECTION -->
  <div class="sec"><h2 id="secTitle">Em destaque</h2><span id="secCount"></span></div>

  <!-- PRODUCT GRID -->
  <div class="content"><div class="grid" id="grid"></div></div>

  <!-- FAB -->
  <button class="fab" onclick="openModal('create')" title="Anunciar">+</button>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab on" onclick="switchTab('home',this)"><span class="ti">🏷️</span>Produtos</button>
    <button class="tab" onclick="switchTab('services',this)"><span class="ti">👤</span>Serviços</button>
    <button class="tab" onclick="switchTab('rent',this)"><span class="ti">🏠</span>Aluguéis</button>
    <button class="tab" onclick="switchTab('profile',this)"><span class="ti">☰</span>Perfil</button>
  </div>
</div>

<!-- CREATE LISTING MODAL -->
<div class="modal" id="modalCreate">
  <div class="backdrop" onclick="closeModal('create')"></div>
  <div class="sheet">
    <button class="close-btn" onclick="closeModal('create')">✕</button>
    <h3>📦 <span>Anunciar produto</span></h3>
    <label>Título *</label>
    <input type="text" id="newTitle" placeholder="Ex: Sofá 3 lugares retrátil" maxlength="100">
    <label>Categoria</label>
    <select id="newCat"><option>Móveis</option><option>Eletrônicos</option><option>Veículos</option><option>Roupas</option><option>Esportes</option><option>Casa</option><option>Ferramentas</option></select>
    <label>Preço (R$) *</label>
    <input type="number" id="newPrice" placeholder="Ex: 850" min="0">
    <label>Cidade</label>
    <select id="newCity"><option>Presidente Getúlio</option><option>Rio do Sul</option><option>Ibirama</option><option>Laurentino</option><option>Lontras</option><option>Aurora</option></select>
    <label>URL da imagem</label>
    <input type="url" id="newImg" placeholder="https://... (cole o link da foto)">
    <label>WhatsApp para contato *</label>
    <input type="tel" id="newWhats" placeholder="(47) 99999-9999">
    <button class="btn" onclick="createListing()">📢 Publicar anúncio</button>
  </div>
</div>

<!-- LOGIN MODAL -->
<div class="modal" id="modalLogin">
  <div class="backdrop" onclick="closeModal('login')"></div>
  <div class="sheet">
    <button class="close-btn" onclick="closeModal('login')">✕</button>
    <h3>👤 <span>Entrar</span></h3>
    <label>Seu nome *</label>
    <input type="text" id="loginName" placeholder="Seu nome completo">
    <label>WhatsApp *</label>
    <input type="tel" id="loginWhats" placeholder="(47) 99999-9999">
    <label>Cidade</label>
    <select id="loginCity"><option>Presidente Getúlio</option><option>Rio do Sul</option><option>Ibirama</option><option>Laurentino</option><option>Lontras</option><option>Aurora</option></select>
    <button class="btn" onclick="doLogin()">Entrar</button>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal" id="modalDetail">
  <div class="backdrop" onclick="closeModal('detail')"></div>
  <div class="sheet">
    <button class="close-btn" onclick="closeModal('detail')">✕</button>
    <div id="detailContent"></div>
  </div>
</div>

<script>
// ─── STATE ───
const CATS = ['Todos','Eletrônicos','Móveis','Veículos','Roupas','Esportes','Casa','Ferramentas'];
const API = 'https://acha-regiao-api.onrender.com/api';
let products = [], activeCat = 'Todos', user = null;

// ─── INIT ───
function init() {
  // Load user
  const saved = localStorage.getItem('acha_user');
  if (saved) { user = JSON.parse(saved); updateAuthUI(); }
  
  // PWA
  if (window.matchMedia('(display-mode: standalone)').matches) {
    document.getElementById('installBanner').classList.remove('show');
  }
  
  // Categories
  document.getElementById('catRow').innerHTML = CATS.map((c,i) => 
    `<span class="cat${i===0?' on':''}" onclick="selCat('${c}',this)">${c}</span>`
  ).join('');
  
  // Load products
  loadProducts();
  
  // Listen for install
  window.addEventListener('beforeinstallprompt', (e) => {
    window._pwaEvent = e;
    document.getElementById('installBanner').classList.add('show');
  });
}

async function loadProducts() {
  try {
    const r = await fetch(`${API}/products`);
    const apiData = await r.json();
    products = [...apiData, ...getLocalListings()];
  } catch(e) {
    products = [...getLocalListings(), ...getMockFallback()];
  }
  render();
}

function getLocalListings() {
  try { return JSON.parse(localStorage.getItem('acha_listings')||'[]'); } catch(e) { return []; }
}
function saveLocalListings(arr) { localStorage.setItem('acha_listings', JSON.stringify(arr)); }

function getMockFallback() {
  return [
    {id:'m1',title:'iPhone 13 Pro 128GB',price:3200,city:'Rio do Sul',category:'Eletrônicos',destaque:true,imageUrl:'https://images.unsplash.com/photo-1632661675695-15c8e3e8e7b4?w=400&h=300&fit=crop'},
    {id:'m2',title:'Sofá 3 Lugares Retrátil',price:850,city:'Presidente Getúlio',category:'Móveis',destaque:false,imageUrl:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400&h=300&fit=crop'},
    {id:'m3',title:'Honda CG 160 Titan 2023',price:14500,city:'Ibirama',category:'Veículos',destaque:true,imageUrl:'https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&h=300&fit=crop'},
    {id:'m4',title:'Geladeira Frost Free 375L',price:1800,city:'Rio do Sul',category:'Eletrônicos',destaque:false,imageUrl:'https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=400&h=300&fit=crop'},
  ];
}

// ─── RENDER ───
function selCat(cat, el) {
  activeCat = cat;
  document.querySelectorAll('.cat').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('secTitle').textContent = cat === 'Todos' ? 'Em destaque' : cat;
  render();
}

function render() {
  let f = activeCat === 'Todos' ? products : products.filter(p => p.category === activeCat);
  const q = document.getElementById('searchIpt').value.toLowerCase();
  if (q) f = f.filter(p => p.title.toLowerCase().includes(q) || (p.city||'').toLowerCase().includes(q));
  
  document.getElementById('secCount').textContent = `${f.length} itens`;
  document.getElementById('grid').innerHTML = f.map(p => `
    <div class="prod" onclick="openDetail('${p.id}')">
      <div class="pw">
        <img src="${p.imageUrl||'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400&h=300&fit=crop'}" alt="${p.title}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400&h=300&fit=crop'">
        ${p.destaque?'<span class="badge">Destaque</span>':''}
        <div class="po"></div>
      </div>
      <div class="pb">
        <span class="pt">${p.title}</span>
        <span class="pp">R$ ${p.price.toLocaleString('pt-BR')}</span>
        <span class="pc"><span class="pd"></span>${p.city||'Alto Vale'}</span>
      </div>
    </div>
  `).join('');
}

// ─── CREATE LISTING ───
function createListing() {
  if (!user) { openModal('login'); return; }
  
  const title = document.getElementById('newTitle').value.trim();
  const price = parseInt(document.getElementById('newPrice').value);
  const whats = document.getElementById('newWhats').value.trim();
  
  if (!title || !price || !whats) { toast('Preencha título, preço e WhatsApp'); return; }
  
  const listing = {
    id: 'local_'+Date.now(),
    title,
    price,
    city: document.getElementById('newCity').value,
    category: document.getElementById('newCat').value,
    imageUrl: document.getElementById('newImg').value || 'https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400&h=300&fit=crop',
    destaque: false,
    whatsapp: whats,
    sellerId: user.id,
    sellerName: user.name,
    createdAt: new Date().toISOString()
  };
  
  const local = getLocalListings();
  local.unshift(listing);
  saveLocalListings(local);
  products.unshift(listing);
  
  // Clear form
  ['newTitle','newPrice','newImg','newWhats'].forEach(id => document.getElementById(id).value = '');
  
  closeModal('create');
  render();
  toast('✅ Anúncio publicado!');
}

// ─── AUTH ───
function doLogin() {
  const name = document.getElementById('loginName').value.trim();
  const whats = document.getElementById('loginWhats').value.trim();
  if (!name || !whats) { toast('Preencha nome e WhatsApp'); return; }
  
  user = {
    id: 'u_'+Date.now(),
    name,
    whatsapp: whats,
    city: document.getElementById('loginCity').value,
    createdAt: new Date().toISOString()
  };
  localStorage.setItem('acha_user', JSON.stringify(user));
  updateAuthUI();
  closeModal('login');
  toast(`👋 Bem-vindo, ${name.split(' ')[0]}!`);
}

function updateAuthUI() {
  if (user) {
    document.getElementById('authBtns').innerHTML = `<span style="font-size:11px;font-weight:700;color:#1A1800;display:flex;align-items:center">👤 ${user.name.split(' ')[0]}</span>`;
  }
}

// ─── DETAIL ───
function openDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  
  document.getElementById('detailContent').innerHTML = `
    <img src="${p.imageUrl}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1560343090-f0409e92791a?w=400&h=300&fit=crop'">
    <div class="detail-price">R$ ${p.price.toLocaleString('pt-BR')}</div>
    <div class="detail-title">${p.title}</div>
    <div class="detail-meta">
      <span>📦 ${p.category||'Produto'}</span><span>📍 ${p.city||'Alto Vale'}</span>
      ${p.sellerName?`<span>👤 ${p.sellerName}</span>`:''}
    </div>
    ${p.whatsapp?`
    <a href="https://wa.me/55${p.whatsapp.replace(/\D/g,'')}?text=Olá! Vi o anúncio "${p.title}" no Acha Região" target="_blank" style="text-decoration:none">
      <button class="wp-btn">💬 Chamar no WhatsApp</button>
    </a>`:''}
  `;
  openModal('detail');
}

// ─── MODAL ───
function openModal(id) { document.getElementById('modal'+id.charAt(0).toUpperCase()+id.slice(1)).classList.add('show'); }
function closeModal(id) { document.getElementById('modal'+id.charAt(0).toUpperCase()+id.slice(1)).classList.remove('show'); }

// ─── TABS ───
function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  el.classList.add('on');
  if (tab === 'services') toast('👤 Serviços em breve');
  if (tab === 'rent') toast('🏠 Aluguéis em breve');
  if (tab === 'profile') {
    if (!user) openModal('login');
    else toast(`👤 ${user.name} • ${user.city}`);
  }
}

// ─── PWA ───
function installPWA() {
  if (window._pwaEvent) {
    window._pwaEvent.prompt();
    window._pwaEvent.userChoice.then(() => {
      document.getElementById('installBanner').classList.remove('show');
    });
  } else {
    toast('📲 No iPhone: Abra no Safari → Compartilhar → Adicionar à Tela');
  }
}

// ─── TOAST ───
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ─── START ───
init();
</script>
